name: Worker tick

# Vercel Cron en el plan Hobby solo permite 1 ejecución al día -- no sirve
# para avanzar el procesamiento de documentos en minutos. Este workflow
# gratuito de GitHub Actions llama a POST /api/worker/tick cada 5 minutos
# y drena la cola completa en cada corrida, para que el procesamiento
# avance aunque nadie tenga la app abierta en el navegador.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Drenar la cola de procesamiento
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "Falta la variable de repositorio APP_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          FAILURES=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sL -X POST "${{ vars.APP_URL }}/api/worker/tick" -o /tmp/response.json -w "%{http_code}")
            RESPONSE=$(cat /tmp/response.json)
            echo "tick $i: http=$HTTP_CODE body=$RESPONSE"
            case "$RESPONSE" in
              *'"processed":false'*)
                echo "No hay trabajo pendiente."
                exit 0
                ;;
              *'"processed":true'*)
                FAILURES=0
                ;;
              *)
                echo "::warning::Respuesta inesperada (no es el JSON esperado del endpoint -- podría ser una pantalla de protección/desafío de Vercel bloqueando peticiones automatizadas)."
                FAILURES=$((FAILURES + 1))
                if [ "$FAILURES" -ge 3 ]; then
                  echo "::error::3 respuestas inesperadas seguidas, abortando."
                  exit 1
                fi
                ;;
            esac
            sleep 3
          done
